[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiopelletstove"
version = "1.0.0"
description = "Async register protocol client for Wi-Fi pellet stoves"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Voluzi"}]
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
dev = ["aiohttp<3.15", "aioresponses>=0.7.8", "pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.9", "build>=1.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
